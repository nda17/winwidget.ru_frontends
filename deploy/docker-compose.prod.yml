# The controller uses a release-specific project. Previous containers remain
# available for rollback; this manifest never deploys backend services.
x-build: &frontend-build
  context: ..
  dockerfile: Dockerfile

x-build-args: &frontend-build-args
  APP_REVISION: ${APP_REVISION:?Exact frontend revision is required}
  NEXT_PUBLIC_MODE: ${NEXT_PUBLIC_MODE:-production}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  NEXT_PUBLIC_PRODUCTION_HOST: ${NEXT_PUBLIC_PRODUCTION_HOST}
  NEXT_PUBLIC_WIDGETS_HOST: ${NEXT_PUBLIC_WIDGETS_HOST:-}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
  NEXT_PUBLIC_RECAPTCHA_HOST: ${NEXT_PUBLIC_RECAPTCHA_HOST:-https://www.recaptcha.net}
  NEXT_PUBLIC_APP_URL: https://crm.winwidget.ru
  NEXT_PUBLIC_MAIN_APP_URL: https://winwidget.ru
  # Frontend deployment must not enable CRM APIs or payments before backend rollout.
  NEXT_PUBLIC_WINCRM_ENABLED: 'false'
  NEXT_PUBLIC_WINCRM_BILLING_ENABLED: 'false'

x-runtime: &frontend-runtime
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'
  PORT: '3000'
  HOSTNAME: 0.0.0.0

x-auth-runtime: &frontend-auth-runtime
  <<: *frontend-runtime
  JWT_JWKS_URL: ${JWT_JWKS_URL}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  JWT_CLOCK_TOLERANCE_SECONDS: ${JWT_CLOCK_TOLERANCE_SECONDS:-5}
  JWT_MAX_TOKEN_LIFETIME_SECONDS: ${JWT_MAX_TOKEN_LIFETIME_SECONDS:-900}

services:
  landing:
    image: winwidget-landing:git-${APP_REVISION}
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        FRONTEND_APP: landing
    environment: *frontend-runtime
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLIENT_HOST_PORT:-3000}:3000'

  crm:
    image: winwidget-crm:git-${APP_REVISION}
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        FRONTEND_APP: crm
    environment: *frontend-runtime
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'

  widgets:
    image: winwidget-widgets:git-${APP_REVISION}
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        FRONTEND_APP: widgets
    environment: *frontend-auth-runtime
    restart: unless-stopped
    ports:
      - '127.0.0.1:3002:3000'

  admin-panel:
    image: winwidget-admin-panel:git-${APP_REVISION}
    build:
      <<: *frontend-build
      args:
        <<: *frontend-build-args
        FRONTEND_APP: admin-panel
    environment: *frontend-auth-runtime
    restart: unless-stopped
    ports:
      - '127.0.0.1:3003:3000'
